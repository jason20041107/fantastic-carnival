<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>創新與創業乙級 刷題系統</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    body {
      font-family: "Noto Sans TC", Arial, sans-serif;
      max-width: 100%;
      margin: 0 auto;
      padding: 1em;
      background-color: #f5f9ff;
      color: #333;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      margin-bottom: 1em;
      color: #003366;
      font-size: 1.8em;
    }
    #progress-bar {
      margin: 1em auto;
      background-color: #ddd;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      width: 100%;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
    }
    #progress-bar-fill {
      height: 100%;
      background-color: #3366cc;
      width: 0%;
      transition: width 0.3s ease-in-out;
    }
    .question-block {
      margin-bottom: 2em;
      padding: 1em;
      border: 1px solid #ccc;
      border-left: 6px solid #3366cc;
      border-radius: 8px;
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .question {
      font-weight: bold;
      margin-bottom: 0.75em;
      font-size: 1em;
    }
    .options label {
      display: block;
      margin: 0.6em 0;
      padding: 0.6em 0.8em;
      font-size: 1em;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }
    .options label:hover {
      background-color: #f0f8ff;
    }
    .explanation {
      margin-top: 0.7em;
      font-style: italic;
      color: #555;
      background-color: #f8f8f8;
      padding: 0.5em 0.8em;
      border-left: 4px solid #ccc;
    }
    #score {
      margin-top: 2em;
      text-align: center;
      font-weight: bold;
      font-size: 1.1em;
      color: #006600;
    }
    #wrong-questions {
      margin-top: 2em;
      padding: 1em;
      background-color: #fff3f3;
      border: 1px solid #dd4444;
      border-radius: 6px;
    }
    .center-btn {
      margin: 1em auto;
      padding: 0.8em 1.5em;
      font-size: 1.1em;
      background-color: #3366cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      width: 90%;
      max-width: 300px;
    }
    .center-btn:hover {
      background-color: #224499;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 1.5em;
      }
      .question {
        font-size: 1em;
      }
      .center-btn {
        font-size: 1em;
        padding: 0.6em;
      }
    }
  </style>
</head>
<body>
  <h1>創新與創業乙級<br>刷題練習系統</h1>
  <div id="progress-bar"><div id="progress-bar-fill"></div></div>
  <div id="quiz-container"></div>
  <div id="score"></div>
  <div id="wrong-questions"></div>
  <button class="center-btn" onclick="calculateScore()">📊 查看成績</button>
  <button class="center-btn" onclick="restartQuiz()">🔁 再練一次（隨機）</button>
  <button class="center-btn" onclick="practiceWrongOnly()">❌ 只練錯題</button>
  <script src="main.js"></script>
</body>
</html>
