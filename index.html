
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>創新與創業乙級 刷題系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>創新與創業乙級<br>刷題練習系統</h1>
  <div id="progress-bar"><div id="progress-bar-fill"></div></div>
  <div id="quiz-container"></div>
  <div id="score"></div>
  <div id="wrong-questions"></div>
  <button class="center-btn" onclick="calculateScore()">📊 查看成績</button>
  <button class="center-btn" onclick="restartQuiz()">🔁 再練一次（隨機）</button>
  <button class="center-btn" onclick="practiceWrongOnly()">❌ 只練錯題</button>
  <script src="main.js"></script>
</body>
</html>
